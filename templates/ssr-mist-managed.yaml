{% extends 'ssr-base-hwb.yaml' %}
{%- block write_files %}
{{ super() }}
{% if not device_map %}
{% set device_map = [{'name': 'mgmt', 'type': 'MGMT', 'interface_name': 'mgmt-0-0', 'pci_address': '0000:00:12.0'}, {'name': 'wan1', 'type': 'WAN', 'interface_name': 'ge-0-1', 'pci_address': '0000:00:13.0'}, {'name': 'lan1', 'type': 'LAN', 'interface_name': 'ge-0-2', 'pci_address': '0000:00:14.0'}] %}
{% endif %}
- path: /etc/128T-hardware-bootstrapper/onboarding-config.json
  content: |
    {
      "name": "{{ hostname }}",
      "mode": "mist-managed",
      "registration-code": "{{ registration_code }}",
      "devicemap": {
        "ethernet": [
          {% for device in device_map %}
          {
            "pciAddress": "{{ device.pci_address }}",
            "name": "{{ device.interface_name }}",
            "type": "{{ device.type }}",
            "description": "{{ device.name | upper }} network interface",
            "bcpNetwork": {
              "virtualHubDevice": {
                "description": "{{ device.name | upper }} network interface",
                "name": "{{ device.name }}"
              }
            },
            "speed": 1000
          }{% if not loop.last %},{% endif %}
          {% endfor %}
        ]
      }
    }
{% endblock %}

{% block second_boot_extra %}
    interface=mgmt-0-0
    old_sum=$(md5sum < /etc/sysconfig/network-scripts/ifcfg-$interface)
    cloud-init devel net-convert -k yaml -p /root/network.yaml -d / -D centos -O sysconfig
    new_sum=$(md5sum < /etc/sysconfig/network-scripts/ifcfg-$interface)
    if [ "$old_sum" != "$new_sum" ]; then
        ifdown $interface
        ifup   $interface
    fi
{% endblock %}

{% block extra_runcmd -%}
{%- endblock %}
